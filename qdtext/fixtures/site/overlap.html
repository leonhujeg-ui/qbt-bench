<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>机器人详情</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>机器人详情</h1><button class="icon-btn" aria-label="返回">←</button></header>
<main>
  <section class="card">
    <div class="row"><span class="label">当前价格</span><span class="label">BTC/USDT</span></div>
    <div class="row price"><span class="num">63,412.50</span><span class="chip warn on-number">执行异常，已通知客服</span></div>
    <p class="hint">价格每 3 秒刷新</p>
  </section>
  <section class="card">
    <div class="actions"><a class="btn" href="#resume">继续运行</a><a class="btn ghost" href="#stop">停止</a></div>
  </section>
</main>
</body></html>
