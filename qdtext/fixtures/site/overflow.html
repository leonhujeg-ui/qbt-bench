<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>成交记录</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>成交记录</h1><button class="tiny-btn" aria-label="筛选">筛</button></header>
<main>
  <div class="wide">
    <div class="cell"><div class="label">时间</div><div>10:32:05</div></div>
    <div class="cell"><div class="label">方向</div><div>买入</div></div>
    <div class="cell"><div class="label">价格</div><div>63,401.2</div></div>
    <div class="cell"><div class="label">数量</div><div>0.0120</div></div>
  </div>
  <section class="card">
    <div class="row"><span class="label">手续费</span><span class="num">0.76</span></div>
    <button class="text-link">查看全部</button>
  </section>
</main>
</body></html>
